[package]
name = "fabien-et-la-trahison-de-olf"
version = "0.5.0"
authors = [
    "Morgan Van Amerongen <vanamerongen.morgan@gmail.com>",
    "Olf Epain <wabtey@disroot.org>",
    "Grassouille la Fripouille",
    "Sombre Roi René",
]
repository = "https://github.com/Fabinistere/fabien-et-la-trahison-de-olf"
license = "GPL"
exclude = ["assets"]
edition = "2021" # 2024

[workspace]
resolver = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.16", features = ["dynamic_linking"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.16" }
# wasm-bindgen = "0.2"


[dependencies]
# ----------- Common ----------
# bevy = "0.16"
bevy_ecs = "0.16"
bevy_state = "0.16"
bevy_reflect = "0.16"
bevy_tweening = "0.13"

# ---------- Dialog -----------
yml_dialog = "0.2"
serde_yaml = "0.9"

# ----- Hitbox - Velocity -----
bevy_rapier2d = { version = "0.30", features = [
    "simd-stable",
    "debug-render-2d",
] }

density-mesh-core = "1.5"
density-mesh-image = "1.5"
# "0.25"
image = "0.23"

# ----- Utilities -----
serde = "1.0"
ron = "0.12"
strum = "0.28"
strum_macros = "0.28"
rand = { version = "0.10", features = ["thread_rng"] }
anyhow = "1"

# ----------- Debug -----------
bevy-inspector-egui = "0.33"
log = "0.4"
log4rs = "1.4"
colored = "3"
# tracing-appender = "0.2"
# tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
