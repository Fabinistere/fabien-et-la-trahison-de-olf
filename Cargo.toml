[package]
name = "fabien-et-la-trahison-de-olf"
version = "0.4.0"
authors = [
  "Morgan Van Amerongen <vanamerongen.morgan@gmail.com>",
  "Olf EPAIN <wabtey@disroot.org>",
  "Grassouille la Fripouille",
  "Sombre Roi René",
]
repository = "https://github.com/Fabinistere/fabien-et-la-trahison-de-olf"
license = "MIT OR Apache-2.0"
exclude = ["assets"]
edition = "2021" # 2024

[workspace]
resolver = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.12", features = ["dynamic_linking"] }
bevy_ecs = "0.12"
bevy_reflect = "0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = "0.12"
bevy_ecs = "0.12"
bevy_reflect = "0.12"
# wasm-bindgen = "0.2"


[dependencies]
# ----------- Common ----------
# bevy = "0.12"
bevy_tweening = "0.9"

# ---------- Dialog -----------
yml_dialog = "0.2"
serde_yaml = "0.9"

# ----- Hitbox - Velocity -----
bevy_rapier2d = { version = "0.23", features = [
  "simd-stable",
  "debug-render-2d",
] }

density-mesh-core = "1.5"
density-mesh-image = "1.5"
# "0.25"
image = "0.23"

# ----- Utilities -----
serde = "1.0"
ron = "0.12"
strum = "0.28"
strum_macros = "0.28"
rand = { version = "0.10", features = ["thread_rng"] }
anyhow = "1"

# ----------- Debug -----------
bevy-inspector-egui = "0.22"
# { version = "0.18", git = "https://github.com/jakobhellermann/bevy-inspector-egui", rev = "a181bdf5c5c621d524d63ee89e22570e01e1b162" }
log = "0.4"
log4rs = "1.4"
colored = "3"
# tracing-appender = "0.2"
# tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
